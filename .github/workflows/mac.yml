name: Build LUX for macOS
# Rebuild trigger: includes resume, achievements/stats and per-district hue.

on:
  workflow_dispatch:
  push:
    branches: ["claude/beautiful-mccarthy-54htkc"]
    paths:
      - 'electron/**'
      - '.github/workflows/mac.yml'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web bundle for Electron
        run: npm run build:electron
      - name: Package macOS app (ad-hoc signed)
        # Ad-hoc signing (identity "-") so the app launches on Apple Silicon
        # after the user clears quarantine; not notarized, so first open still
        # needs right-click → Open (or: xattr -cr /Applications/LUX.app).
        run: npx electron-builder --mac --publish never
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lux-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
